[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ranoversight"
version = "0.1.0"
description = "Can a monitor tell a harmful network change from a normal optimisation step? An AI control evaluation on a simulated radio access network."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Aditya Chaudhuri" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    # Pinned: ControlArena's API changes between major versions (ARCHITECTURE.md, D4).
    "control-arena==20.1.1",
    "inspect-ai==0.3.287",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/akchaudhuri/ran-agent-oversight"

[tool.hatch.build.targets.wheel]
packages = ["src/ranoversight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
